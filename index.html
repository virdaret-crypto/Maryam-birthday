<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Maryam ❤️</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
height:100vh;
overflow:hidden;
background:
radial-gradient(circle at top,#3a2a55,#080810);
font-family:tahoma;
color:white;
display:flex;
justify-content:center;
align-items:center;
}


.stars{
position:absolute;
width:100%;
height:100%;
background-image:
radial-gradient(white 1px,transparent 1px);
background-size:40px 40px;
opacity:.4;
animation:move 20s linear infinite;
}

@keyframes move{
from{transform:translateY(0)}
to{transform:translateY(40px)}
}


.container{
text-align:center;
z-index:2;
}


.envelope{
width:280px;
height:180px;
background:#c9a45c;
border-radius:10px;
position:relative;
margin:auto;
box-shadow:0 20px 50px black;
}


.envelope:before{
content:"";
position:absolute;
top:0;
left:0;
border-left:140px solid transparent;
border-right:140px solid transparent;
border-top:90px solid #e0bf7b;
}


.seal{
position:absolute;
top:70px;
left:115px;
width:50px;
height:50px;
background:#9b1c31;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
}


h1{
font-size:35px;
margin-bottom:40px;
}


button{
margin-top:40px;
padding:15px 40px;
border:none;
border-radius:50px;
font-size:18px;
background:#d4af37;
color:white;
cursor:pointer;
box-shadow:0 0 20px #d4af37;
}


button:hover{
transform:scale(1.05);
}


.hidden{
display:none;
}

</style>

</head>


<body>


<div class="stars"></div>


<div class="container">

<h1>برای مریم عزیزم ❤️</h1>


<div class="envelope">

<div class="seal">
❤️
</div>

</div>


<button onclick="openCard()">
باز کردن کارت
</button>


</div>



<script>

function openCard(){

document.querySelector(".container").innerHTML=`

<h1>
مریم عزیزم...
</h1>

<p style="font-size:22px">
یک داستان زیبا قرار است شروع شود...
</p>

`;

}

</script>


</body>
</html>
