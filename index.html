<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Maryam</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

height:100vh;
overflow:hidden;

background:
radial-gradient(circle at center,#fff7e8,#d8c0a0);

display:flex;
justify-content:center;
align-items:center;

font-family:'Cormorant Garamond',serif;

}


/* نور محیط */

body:before{

content:"";

position:absolute;
width:600px;
height:600px;

background:rgba(255,255,255,.45);

filter:blur(100px);

}


/* صحنه */

.scene{

position:relative;
text-align:center;

}


/* پاکت */

.envelope{

position:relative;

width:360px;
height:240px;

background:
linear-gradient(145deg,#f7e7cc,#e6c89c);

border-radius:8px;

box-shadow:

0 40px 80px rgba(70,40,10,.35),
inset 0 0 30px rgba(255,255,255,.5);

transform-style:preserve-3d;

animation:float 4s infinite ease-in-out;

}


@keyframes float{

50%{
transform:translateY(-12px);
}

}



/* در پاکت */

.flap{

position:absolute;

top:0;
left:0;

width:0;
height:0;

border-left:180px solid transparent;
border-right:180px solid transparent;

border-top:120px solid #f1d8b4;

transform-origin:top;

transition:1s;

z-index:3;

}


/* کاغذ داخل */

.letter{

position:absolute;

width:300px;
height:180px;

background:white;

left:30px;
top:40px;

border-radius:5px;

box-shadow:0 10px 30px #0002;

display:flex;

justify-content:center;

align-items:center;

font-size:40px;

font-family:'Great Vibes',cursive;

color:#9b1d20;

transition:1s;

}



/* مهر */

.seal{

position:absolute;

z-index:5;

left:50%;
top:50%;

transform:translate(-50%,-50%);

width:95px;
height:95px;

border-radius:50%;

background:

radial-gradient(circle,#c52b35,#7b1118);

box-shadow:

0 10px 20px #0005,
inset 0 0 15px #ff7777;

display:flex;

align-items:center;
justify-content:center;

color:#e8c879;

font-family:'Great Vibes',cursive;

font-size:34px;

cursor:pointer;

transition:.5s;

}


.seal:hover{

transform:translate(-50%,-50%) scale(1.08);

}


/* باز شدن */

.open .flap{

transform:rotateX(180deg);

}


.open .seal{

opacity:0;

transform:
translate(-50%,-50%) scale(.2);

}


.open .letter{

transform:translateY(-150px);

}



</style>

</head>


<body>


<div class="scene">


<div class="envelope" id="env">


<div class="letter">
Maryam
</div>


<div class="flap"></div>


<div class="seal" onclick="openCard()">
Maryam
</div>


</div>


</div>



<script>

function openCard(){

document
.getElementById("env")
.classList.add("open");


setTimeout(()=>{

document.body.innerHTML=`

<div style="
text-align:center;
font-family:'Cormorant Garamond';
font-size:40px;
color:#8b1c1c;
">

مریم عزیزم...

<br><br>

یک زیبا آغاز می‌شود...

</div>

`;

},2000);


}

</script>


</body>
</html>
